services:

  # ── Qdrant ───────────────────────────────────────────────────────────────────
  # Only needed if you want a fresh isolated instance.
  # Your existing container on localhost:6333 already covers this.
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"    # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
